title: "ENV 226 Lab Online R Manual"
delete_merged_file: true
output_dir: "docs"
language:
  ui:
    chapter_name: "Chapter "
resource_files: ["images/**", "downloads/**"]

# Chapter order follows the course structure: tools -> field skills ->
# organism -> population -> community -> ecosystem -> landscape.
# FILENAME NUMBER = CHAPTER NUMBER - 1 (index.Rmd is chapter 1 and cannot be
# renamed). If you reorder again, rename too, or this comment lies.
# Two labs do not run in chapter order - both say so at the top of the chapter:
#   ch 10 Species interactions I is planted early and harvested in ch 19
#   ch 21 Litter decomposition is deployed around week 3 and retrieved week 12
# Not built: _archive-IntroR.Rmd, _archive-SpeciesInteractions.Rmd
# NOTE: images/ subfolders still carry the OLD chapter numbers.
rmd_files: [
  "index.Rmd",                               # 1. Introduction
  "01-GettingStarted.Rmd",                   # 2. Getting started: the course, your tools, and your data
  "02-Spreadsheets.Rmd",                     # 3. Working with data in a spreadsheet
  "03-DescriptiveStatistics.Rmd",            # 4. Descriptive statistics
  "04-TreeWalk.Rmd",                         # 5. Identifying trees: keys, the tree walk, and the herbarium record
  "05-FieldMethods.Rmd",                     # 6. Field methods: running a monitoring plot
  "06-Dendrochronology.Rmd",                 # 7. Dendrochronology (spring alternate to 5)
  "07-EcologicalSampling.Rmd",               # 8. Ecological sampling - design your own at Sinclair Wash
  "08-UrbanEcology.Rmd",                     # 9. Urban ecology: the Crosstown Walk (alternative to 7)
  "09-SpeciesInteractionsSetup.Rmd",         # 10. Species interactions I - planted here, runs 6-8 weeks
  "10-BehavioralEcology.Rmd",                # 11. Behavioral ecology - ORGANISM level, good cold-weather lab
  "11-NaturalSelection.Rmd",                 # 12. Natural selection
  "12-MarkRecapture.Rmd",                    # 13. Mark-recapture - abundance; indoor track is weather-proof
  "13-PopulationStructure.Rmd",              # 14. Population structure and demography
  "14-PlantDemography.Rmd",                  # 15. Plant population biology: matrix models and viability
  "15-PopulationEcology.Rmd",                # 16. Population ecology (Daphnia / duckweed / replacement series)
  "16-InvasiveSpecies.Rmd",                  # 17. Invasive species
  "17-BasicStatisticalTest.Rmd",             # 18. Basic statistical testing
  "18-SelectingStatisticalTests.Rmd",        # 19. Selecting statistical tests
  "19-SpeciesInteractionsPoster.Rmd",        # 20. Species interactions II - analysis and poster
  "20-SpeciesDiversity.Rmd",                 # 21. Species diversity
  "21-LitterDecomposition.Rmd",              # 22. Litter decomposition - DEPLOY week 3, RETRIEVE week 12
  "22-WaterQuality.Rmd",                     # 23. Water quality
  "23-SpeciesDistributionModeling.Rmd",      # 24. Species distribution modeling
  "24-LabReportGuidelines.Rmd",              # 25. Written lab report guidelines (reference)
  "25-Conclusion.Rmd"                       # 26. ENV 226 Lab Exercises
]
